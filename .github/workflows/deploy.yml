name: Deploy

# Pulls main on the server and runs deploy/server-deploy.sh (builds backend,
# admin and client there; PM2 runs api, worker, bot and client).
# Auth: repo secret SSH_PRIVATE_KEY (preferred) or SSH_PRIVATE_PASSWORD.

on:
  push:
    branches: [main]
    paths: [backend/**, admin/**, client/**, deploy/**, .github/workflows/deploy.yml]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVER_HOST: 94.130.33.123
  SERVER_USERNAME: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PRIVATE_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            export PATH="$HOME/.nvm/versions/node/v22.23.2/bin:$PATH"
            cd /root/book_generator
            git pull --ff-only origin main
            bash deploy/server-deploy.sh
