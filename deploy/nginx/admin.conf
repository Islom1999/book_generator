# admin.ertaklar.topsites.uz -> admin panel (static) + /api proxied to the API
server {
    listen 80;
    server_name admin.ertaklar.topsites.uz;
    root /var/www/admin.ertaklar.topsites.uz;
    index index.html;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed bundles never change; index.html must always be fresh.
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
