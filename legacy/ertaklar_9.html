/* Minimal Supabase REST helpers (no SDK needed) */
const sbHeaders = {
  apikey: SUPABASE_ANON,
  Authorization: `Bearer ${SUPABASE_ANON}`,
  "Content-Type": "application/json"
};
async function sbSelect(table, query = "") {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    headers: sbHeaders
  });
  if (!res.ok) throw new Error(`select ${table} failed: ${res.status}`);
  return res.json();
}
async function sbInsert(table, row) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: {
      ...sbHeaders,
      Prefer: "return=minimal"
    },
    body: JSON.stringify(row)
  });
  if (!res.ok) throw new Error(`insert ${table} failed: ${res.status} ${await res.text()}`);
  return true;
}
async function sbUploadPhoto(file) {
  const path = `orders/${Date.now()}_${Math.random().toString(36).slice(2)}.${file.name.split(".").pop() || "jpg"}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON,
      Authorization: `Bearer ${SUPABASE_ANON}`,
      "Content-Type": file.type || "image/jpeg"
    },
    body: file
  });
  if (!res.ok) throw new Error(`upload failed: ${res.status}`);
  return `${SUPABASE_URL}/storage/v1/object/public/photos/${path}`;
}

/* ----------------------------- Supabase Auth --------------------------- */
function getToken() {
  try {
    return JSON.parse(localStorage.getItem("ert_admin") || "null")?.access_token || null;
  } catch {
    return null;
  }
}
function getRefresh() {
  try {
    return JSON.parse(localStorage.getItem("ert_admin") || "null")?.refresh_token || null;
  } catch {
    return null;
  }
}
function authHeaders() {
  const tok = getToken();
  return {
    apikey: SUPABASE_ANON,
    Authorization: `Bearer ${tok || SUPABASE_ANON}`,
    "Content-Type": "application/json"
  };
}
async function sbLogin(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email,
      password
    })
  });
  if (!res.ok) throw new Error("login_failed");
  const data = await res.json();
  try {
    localStorage.setItem("ert_admin", JSON.stringify(data));
  } catch {}
  return data;
}
// Login muddati tugasa, refresh_token bilan yangilaydi
async function sbRefresh() {
  const rt = getRefresh();
  if (!rt) return false;
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      refresh_token: rt
    })
  });
  if (!res.ok) return false;
  const data = await res.json();
  try {
    localStorage.setItem("ert_admin", JSON.stringify(data));
  } catch {}
  return true;
}
function sbLogout() {
  try {
    localStorage.removeItem("ert_admin");
  } catch {}
}
function isAdmin() {
  return !!getToken();
}

// 401 (JWT expired) bo'lsa avtomatik refresh qilib qayta uradi
async function authFetch(url, opts = {}) {
  let res = await fetch(url, {
    ...opts,
    headers: {
      ...authHeaders(),
      ...(opts.headers || {})
    }
  });
  if (res.status === 401) {
    const ok = await sbRefresh();
    if (ok) {
      res = await fetch(url, {
        ...opts,
        headers: {
          ...authHeaders(),
          ...(opts.headers || {})
        }
      });
    }
  }
  return res;
}
async function sbAuthSelect(table, query = "") {
  const res = await authFetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`);
  if (!res.ok) throw new Error(`select ${table} failed: ${res.status}`);
  return res.json();
}
async function sbAuthInsert(table, row) {
  const res = await authFetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: {
      Prefer: "return=minimal"
    },
    body: JSON.stringify(row)
  });
  if (!res.ok) throw new Error(`insert ${table} failed: ${res.status} ${await res.text()}`);
  return true;
}
async function sbAuthUpdate(table, id, patch) {
  const res = await authFetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: "PATCH",
    headers: {
      Prefer: "return=minimal"
    },
    body: JSON.stringify(patch)
  });
  if (!res.ok) throw new Error(`update ${table} failed: ${res.status}`);
  return true;
}
async function sbAuthDelete(table, id) {
  const res = await authFetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: "DELETE"
  });
  if (!res.ok) throw new Error(`delete ${table} failed: ${res.status}`);
  return true;
}
async function sbUploadCover(file) {
  const path = `covers/${Date.now()}_${Math.random().toString(36).slice(2)}.${file.name.split(".").pop() || "jpg"}`;
  const doUpload = () => fetch(`${SUPABASE_URL}/storage/v1/object/photos/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON,
      Authorization: `Bearer ${getToken() || SUPABASE_ANON}`,
      "Content-Type": file.type || "image/jpeg"
    },
    body: file
  });
  let res = await doUpload();
  if (res.status === 401 && (await sbRefresh())) res = await doUpload();
  if (!res.ok) throw new Error(`cover upload failed: ${res.status}`);
  return `${SUPABASE_URL}/storage/v1/object/public/photos/${path}`;
}
async function sbUploadFile(file, folder = "books") {
  const ext = file.name.split(".").pop() || "pdf";
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const doUpload = () => fetch(`${SUPABASE_URL}/storage/v1/object/photos/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON,
      Authorization: `Bearer ${getToken() || SUPABASE_ANON}`,
      "Content-Type": file.type || "application/octet-stream"
    },
    body: file
  });
  let res = await doUpload();
  if (res.status === 401 && (await sbRefresh())) res = await doUpload();
  if (!res.ok) throw new Error(`file upload failed: ${res.status}`);
  return `${SUPABASE_URL}/storage/v1/object/public/photos/${path}`;
}

/* ------------------------------- styles -------------------------------- */
const CSS = `
:root{
  --ink:#1b1633; --ink-soft:#4a4368; --paper:#fbf8f3; --cream:#f3ecde;
  --night:#211a45; --night-2:#2c2358; --gold:#f4b740; --gold-deep:#e09a1f;
  --violet:#6c5ce7; --violet-deep:#5a48d6; --line:rgba(33,26,69,.10);
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(33,26,69,.10); --shadow-lg:0 24px 60px rgba(33,26,69,.18);
}
*{box-sizing:border-box}
.ert{font-family:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.ert h1,.ert h2,.ert h3{font-family:'Baloo 2',sans-serif;font-weight:700;letter-spacing:-.01em;margin:0;overflow-wrap:break-word}
.ert p{margin:0;line-height:1.6;overflow-wrap:break-word}
.ert button{font-family:inherit;cursor:pointer;border:none;background:none}
.ert a{color:inherit;text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(16px,4vw,22px);width:100%}

/* header */
.hd{position:sticky;top:0;z-index:50;background:rgba(251,248,243,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;gap:clamp(10px,2vw,24px);height:66px}
.logo{display:flex;align-items:center;gap:9px;font-family:'Baloo 2';font-weight:800;font-size:clamp(19px,3vw,22px);cursor:pointer;white-space:nowrap}
.logo-star{width:30px;height:30px;display:grid;place-items:center;background:var(--night);border-radius:9px;color:var(--gold);font-size:17px;flex-shrink:0}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{padding:9px 13px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink-soft);white-space:nowrap}
.nav button:hover{background:var(--cream);color:var(--ink)}
.nav button.on{color:var(--violet-deep)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.lang-btn{padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid var(--line);color:var(--ink-soft)}
.lang-btn:hover{background:var(--cream)}
.cart-btn{position:relative;width:42px;height:42px;border-radius:11px;background:var(--night);color:#fff;display:grid;place-items:center;font-size:18px}
.cart-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;background:var(--gold);color:var(--night);border-radius:10px;font-size:12px;font-weight:800;display:grid;place-items:center}

/* hero — full-bleed, large, WonderWraps-style */
.hero{position:relative;overflow:hidden;
  background:
   radial-gradient(900px 600px at 18% 30%, #4c3aa6, transparent 70%),
   radial-gradient(1000px 700px at 90% 70%, #7a52d4, transparent 70%),
   linear-gradient(135deg,#3a2c82,#6c5ce7)}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(24px,4vw,56px);align-items:center;
  min-height:clamp(440px,60vh,640px);padding:clamp(36px,5vw,60px) 0}
.hero-copy{max-width:560px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:clamp(13px,1.5vw,15px);color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:8px 15px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.hero h1{font-size:clamp(34px,5.6vw,64px);line-height:1.04;margin:18px 0 0;color:#fff}
.hero h1 .g{color:var(--gold)}
.hero-sub{font-size:clamp(16px,1.9vw,20px);color:rgba(255,255,255,.82);max-width:30em;margin-top:18px;line-height:1.55}
.hero-cta{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.hero .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:clamp(15px,2vw,16px);padding:13px clamp(16px,3vw,22px);border-radius:14px;transition:transform .12s ease, box-shadow .2s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--gold);color:var(--night);box-shadow:0 8px 22px rgba(224,154,31,.35)}
.btn-pri:hover{box-shadow:0 12px 28px rgba(224,154,31,.45)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--cream)}
.btn-dark{background:var(--night);color:#fff}
.btn-dark:hover{background:var(--night-2)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero motion — large tilted storybook */
.hero-motion{position:relative;display:grid;place-items:center;min-height:clamp(340px,46vw,520px)}
.motion-stage{position:relative;width:clamp(280px,40vw,460px);height:clamp(330px,48vw,540px);transform:rotate(-7deg)}
.mbook{position:absolute;inset:0;border-radius:18px;box-shadow:0 40px 80px rgba(0,0,0,.45);overflow:hidden;display:grid;place-items:center;border:6px solid rgba(255,255,255,.08)}
.mbook .scene{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(120px,20vw,240px);opacity:0;animation:sceneCycle 12s infinite}
.mbook .scene:nth-child(1){animation-delay:0s}
.mbook .scene:nth-child(2){animation-delay:4s}
.mbook .scene:nth-child(3){animation-delay:8s}
@keyframes sceneCycle{0%{opacity:0;transform:scale(1.06)}4%{opacity:1;transform:scale(1)}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
.mbook .title-top{position:absolute;top:26px;left:0;right:0;text-align:center;color:rgba(255,255,255,.92);font-family:'Baloo 2';font-weight:700;font-size:clamp(15px,2.2vw,22px);text-shadow:0 2px 8px rgba(0,0,0,.4);padding:0 18px}
/* child photo morphs into hero badge */
.morph{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);border-radius:14px;padding:9px 16px 9px 9px;box-shadow:var(--shadow);white-space:nowrap}
.morph .ph{width:clamp(44px,6vw,56px);height:clamp(44px,6vw,56px);border-radius:11px;background:linear-gradient(135deg,#cdbff5,#f4d089);overflow:hidden;display:grid;place-items:center;font-size:clamp(24px,3.5vw,30px);animation:flip 12s infinite}
@keyframes flip{0%,46%{filter:saturate(.7) brightness(1)}50%,96%{filter:saturate(1.2) brightness(1.05)}}
.morph .arw{color:var(--violet-deep);font-size:clamp(16px,2.5vw,20px);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.morph .nm{font-weight:800;font-size:clamp(15px,2.2vw,18px);color:var(--night)}
.spark{position:absolute;color:var(--gold);font-size:clamp(18px,2.5vw,26px);animation:tw 3s ease-in-out infinite;z-index:2}
@keyframes tw{0%,100%{opacity:.3;scale:.8}50%{opacity:1;scale:1.15}}

/* sections */
.sec{padding:clamp(36px,6vw,54px) 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(18px,3vw,26px)}
.sec-head .eye{font-weight:700;color:var(--gold-deep);font-size:clamp(12px,1.8vw,14px);text-transform:uppercase;letter-spacing:.07em}
.sec-head h2{font-size:clamp(22px,3.6vw,34px);margin-top:6px}
.sec-head p{color:var(--ink-soft);margin-top:4px;font-size:clamp(14px,2vw,16px)}
.link-all{font-weight:700;color:var(--violet-deep);white-space:nowrap;font-size:clamp(14px,2vw,16px)}
.link-all:hover{text-decoration:underline}

/* book grid — auto-fit so it never overflows on any screen */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:clamp(12px,2vw,22px)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease, box-shadow .2s ease;cursor:pointer}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.cover{aspect-ratio:4/5;display:grid;place-items:center;font-size:clamp(48px,9vw,74px);position:relative}
.cover .badge{position:absolute;top:12px;left:12px;font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px;color:#fff}
.badge.best{background:var(--gold-deep)}
.badge.new{background:var(--violet)}
.card-b{padding:14px 15px 17px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-b h3{font-size:clamp(16px,2.4vw,18px)}
.card-b .d{color:var(--ink-soft);font-size:clamp(13px,1.9vw,14px);flex:1}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.price{font-weight:800;font-size:clamp(15px,2.2vw,17px);white-space:nowrap}
.price small{font-weight:600;color:var(--ink-soft);font-size:13px}
.mini{font-weight:700;font-size:14px;color:var(--violet-deep);background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:11px;white-space:nowrap}
.mini:hover{background:var(--cream)}

/* how it works */
.how{background:var(--night);color:#fff;border-radius:clamp(20px,3vw,28px);padding:clamp(30px,5vw,46px) clamp(20px,4vw,34px);margin:10px 0}
.how .eye{text-align:center;color:var(--gold);font-weight:700;font-size:clamp(12px,1.8vw,14px);text-transform:uppercase;letter-spacing:.07em}
.how h2{color:#fff;text-align:center;font-size:clamp(22px,3.4vw,34px);margin-top:6px}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(16px,3vw,22px);margin-top:clamp(24px,4vw,34px)}
.step-c{text-align:center}
.step-n{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--night-2);display:grid;place-items:center;font-size:26px;border:1px solid rgba(255,255,255,.12);position:relative}
.step-n .num{position:absolute;top:-8px;right:-8px;width:24px;height:24px;background:var(--gold);color:var(--night);border-radius:50%;font-size:13px;font-weight:800;display:grid;place-items:center}
.step-c h3{color:#fff;font-size:clamp(16px,2.4vw,18px)}
.step-c p{color:rgba(255,255,255,.66);font-size:clamp(13px,1.9vw,14px);margin-top:5px}

/* faces showcase */
.faces{background:linear-gradient(160deg,#fff,var(--cream));border:1px solid var(--line);border-radius:clamp(20px,3vw,28px);padding:clamp(28px,5vw,44px) clamp(20px,4vw,34px);text-align:center}
.faces .eye{color:var(--violet-deep);font-weight:700;font-size:clamp(12px,1.8vw,14px);text-transform:uppercase;letter-spacing:.06em}
.faces h2{font-size:clamp(22px,3.4vw,34px);margin-top:6px}
.faces-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:clamp(14px,3vw,26px);margin-top:clamp(24px,4vw,36px)}
.faces-card .imgs{display:flex;gap:8px;justify-content:center}
.faces-card .fc{width:clamp(46px,8vw,62px);height:clamp(46px,8vw,62px);border-radius:14px;display:grid;place-items:center;font-size:clamp(24px,4vw,32px);box-shadow:var(--shadow)}
.faces-card h3{font-size:clamp(16px,2.2vw,18px);margin-top:12px}

/* career band */
.career{background:var(--night);color:#fff;border-radius:clamp(20px,3vw,28px);padding:clamp(28px,5vw,44px) clamp(20px,4vw,34px)}
.career .eye{color:var(--gold);font-weight:700;font-size:clamp(12px,1.8vw,14px);text-transform:uppercase;letter-spacing:.06em}
.career h2{color:#fff;font-size:clamp(22px,3.4vw,34px);margin-top:6px;max-width:16em}
.career-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:clamp(12px,2vw,18px);margin-top:clamp(24px,4vw,32px)}
.career-card{background:var(--night-2);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px;text-align:center}
.career-card .ic{font-size:clamp(34px,6vw,46px)}
.career-card p{color:#fff;font-weight:700;margin-top:8px;font-size:clamp(14px,2vw,16px)}

/* age band */
.age-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:clamp(14px,2vw,20px)}
.age-card{border-radius:var(--radius);padding:clamp(22px,4vw,32px) 20px;text-align:center;cursor:pointer;color:#fff;transition:transform .15s ease,box-shadow .2s ease}
.age-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.age-card .ic{font-size:clamp(40px,7vw,56px)}
.age-card h3{color:#fff;font-size:clamp(18px,2.6vw,22px);margin-top:8px}
.age-card .go{margin-top:8px;font-weight:700;color:rgba(255,255,255,.9);font-size:14px}

/* faq */
.faq-wrap{max-width:760px;margin:0 auto}
.faq-item{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.faq-q{width:100%;text-align:left;padding:16px 18px;font-weight:700;font-size:clamp(15px,2.2vw,17px);display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink)}
.faq-q .pm{color:var(--violet-deep);font-size:22px;flex-shrink:0}
.faq-a{padding:0 18px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;color:var(--ink-soft);font-size:clamp(14px,2vw,15px)}
.faq-a.open{max-height:300px;padding:0 18px 16px}

/* detail */
.detail{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(24px,4vw,42px);align-items:start;padding:clamp(28px,4vw,40px) 0}
.detail-cover{aspect-ratio:4/5;border-radius:22px;display:grid;place-items:center;font-size:clamp(80px,14vw,120px);box-shadow:var(--shadow-lg);position:sticky;top:84px}
/* page gallery */
.detail-gallery{position:sticky;top:84px}
.gal-main{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);display:grid;place-items:center}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-emoji{font-size:clamp(80px,14vw,120px)}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:var(--shadow);font-size:18px;font-weight:800;color:var(--night);display:grid;place-items:center}
.gal-arrow.left{left:12px}
.gal-arrow.right{right:12px}
.gal-arrow:hover{background:#fff}
.gal-count{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(33,26,69,.8);color:#fff;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px}
.gal-thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:6px}
.gal-thumb{flex:0 0 auto;width:58px;height:72px;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--cream)}
.gal-thumb img{width:100%;height:100%;object-fit:cover}
.gal-thumb.on{border-color:var(--violet)}
@media(max-width:1024px){.detail-gallery{position:static}}
.detail-info h1{font-size:clamp(26px,4.2vw,42px)}
.detail-info .d{font-size:clamp(16px,2.4vw,18px);color:var(--ink-soft);margin-top:12px}
.specs{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.spec{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 15px;min-width:90px;flex:1}
.spec .l{font-size:12px;color:var(--ink-soft);font-weight:600}
.spec .v{font-size:clamp(15px,2.2vw,17px);font-weight:800;margin-top:2px}
.detail-price{display:flex;align-items:baseline;gap:8px;margin:24px 0}
.detail-price b{font-size:clamp(26px,4vw,30px)}
.back-link{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-soft);padding:10px 0;margin-top:8px;font-size:clamp(14px,2vw,16px)}
.back-link:hover{color:var(--ink)}

/* wizard */
.wiz{max-width:680px;margin:0 auto;padding:clamp(24px,4vw,34px) 0 60px}
.wiz-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(22px,4vw,30px)}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.wiz-step{font-weight:700;color:var(--violet-deep);font-size:14px}
.wiz-top .bt{font-weight:800;font-size:clamp(14px,2vw,16px)}
.progress{height:7px;background:var(--cream);border-radius:999px;overflow:hidden;margin:14px 0 24px}
.progress i{display:block;height:100%;background:var(--gold);transition:width .35s ease}
.wiz h2{font-size:clamp(20px,3vw,24px);margin-bottom:18px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.field .opt{font-weight:600;color:var(--ink-soft);font-size:13px}
.inp,.ta{width:100%;font-family:inherit;font-size:16px;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);transition:border-color .15s ease}
.inp:focus,.ta:focus{outline:none;border-color:var(--violet)}
.ta{min-height:84px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:14px;border-radius:13px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:clamp(14px,2vw,15px);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{border-color:var(--violet);background:rgba(108,92,231,.08);color:var(--violet-deep)}
.ages{display:flex;gap:9px;flex-wrap:wrap}
.ages button{width:50px;height:50px;border-radius:13px;border:1.5px solid var(--line);background:var(--paper);font-weight:800;font-size:16px;color:var(--ink-soft)}
.ages button.on{border-color:var(--violet);background:rgba(108,92,231,.08);color:var(--violet-deep)}
.drop{border:2px dashed rgba(108,92,231,.4);border-radius:16px;padding:26px;text-align:center;background:rgba(108,92,231,.04);cursor:pointer;transition:background .15s ease}
.drop:hover{background:rgba(108,92,231,.08)}
.drop .ic{font-size:34px}
.drop p{color:var(--ink-soft);font-size:14px;margin-top:8px}
.photo-prev{display:flex;align-items:center;gap:14px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.photo-prev img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0}
.photo-prev .x{margin-left:auto;color:var(--ink-soft);font-weight:700;padding:8px 10px;border-radius:9px;flex-shrink:0}
.photo-prev .x:hover{background:var(--cream);color:var(--ink)}
.wiz-nav{display:flex;gap:12px;margin-top:24px}
.pv-book{aspect-ratio:4/5;max-width:300px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
/* preview pages */
.pv-pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:16px}
.pv-page{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--cream)}
.pv-page img{width:100%;height:100%;object-fit:cover;display:block}
.pv-page.locked img{filter:blur(7px) brightness(.85);transform:scale(1.05)}
.pv-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(33,26,69,.32);color:#fff;text-align:center;padding:10px}
.pv-lock-ic{font-size:26px}
.pv-lock-tx{font-size:12px;font-weight:700;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.pv-face{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:var(--shadow)}
.pv-pagenum{position:absolute;top:8px;left:8px;background:rgba(33,26,69,.7);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.pv-locked-note{grid-column:1/-1;text-align:center;background:var(--cream);border-radius:12px;padding:12px;font-weight:700;color:var(--gold-deep)}
.wiz-order{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.pv-photo{width:clamp(70px,16vw,84px);height:clamp(70px,16vw,84px);border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:var(--shadow)}
.pv-hero{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:13px;padding:8px 14px;font-weight:800;font-size:clamp(15px,2.4vw,18px);color:var(--night);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.pv-note{background:var(--cream);border-radius:13px;padding:14px 16px;color:var(--ink-soft);font-size:14px;text-align:center;margin-top:6px}

/* cart */
.cart-page{max-width:760px;margin:0 auto;padding:clamp(24px,4vw,34px) 0 60px}
.cart-row{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.cart-cover{width:70px;height:88px;border-radius:11px;display:grid;place-items:center;font-size:36px;flex-shrink:0;overflow:hidden}
.cart-meta{flex:1;min-width:0}
.cart-meta h3{font-size:clamp(15px,2.2vw,17px)}
.cart-meta .for{font-size:14px;color:var(--ink-soft);margin-top:3px;overflow-wrap:break-word}
.cart-meta .rm{font-size:13px;color:#c0392b;font-weight:700;margin-top:6px;display:inline-block}
.cart-meta .rm:hover{text-decoration:underline}
.cart-price{font-weight:800;font-size:clamp(15px,2.2vw,17px);white-space:nowrap}
.cart-sum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:8px}
.cart-sum .row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(16px,2.4vw,18px)}
.cart-sum .row b{font-size:clamp(19px,3vw,22px);white-space:nowrap}
.empty{text-align:center;padding:70px 0}
.empty .ic{font-size:60px}
.empty h2{margin:16px 0 6px}
.empty p{color:var(--ink-soft);margin-bottom:20px}

/* checkout */
.co{max-width:680px;margin:0 auto;padding:clamp(24px,4vw,34px) 0 60px}
.co-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
.pay button{padding:15px;border-radius:13px;border:1.5px solid var(--line);background:var(--paper);font-weight:800;font-size:15px;color:var(--ink-soft)}
.pay button.on{border-color:var(--violet);background:rgba(108,92,231,.08);color:var(--violet-deep)}
.done{text-align:center;padding:60px 0}
.done .ic{font-size:70px}
.done h2{font-size:clamp(24px,3.4vw,28px);margin:14px 0 8px}
.done p{color:var(--ink-soft);max-width:26em;margin:0 auto 22px}

/* footer */
.ft{background:var(--night);color:#fff;margin-top:30px;padding:clamp(36px,5vw,48px) 0 30px}
.ft-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:clamp(24px,4vw,30px)}
.ft .logo{color:#fff}
.ft p{color:rgba(255,255,255,.6);font-size:14px;margin-top:12px;max-width:24em}
.ft h4{color:#fff;font-size:15px;margin-bottom:12px}
.ft ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.ft a{color:rgba(255,255,255,.7);font-size:14px;cursor:pointer}
.ft a:hover{color:var(--gold)}
.ft-base{border-top:1px solid rgba(255,255,255,.12);margin-top:30px;padding-top:18px;color:rgba(255,255,255,.5);font-size:13px;text-align:center}

/* ----- admin ----- */
.admin{padding:clamp(20px,4vw,32px) 0 60px}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.admin-top h1{font-size:clamp(22px,3.4vw,30px)}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.admin-tabs button{padding:10px 16px;border-radius:11px;font-weight:700;font-size:15px;background:#fff;border:1px solid var(--line);color:var(--ink-soft)}
.admin-tabs button.on{background:var(--night);color:#fff;border-color:var(--night)}
.muted{color:var(--ink-soft);padding:20px 0;font-size:15px}
.err-box{background:#fdecea;color:#c0392b;border-radius:12px;padding:12px 14px;font-size:14px;margin:8px 0}
.admin-login{max-width:420px;margin:0 auto;padding:clamp(30px,8vw,70px) 0}
.login-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px}
/* orders */
.ord-list{display:flex;flex-direction:column;gap:14px}
.ord-card{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.ord-photo{width:78px;height:78px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--cream);display:grid;place-items:center;font-size:34px}
.ord-photo img{width:100%;height:100%;object-fit:cover}
.ord-body{flex:1;min-width:0}
.ord-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ord-head b{font-size:16px}
.st{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:capitalize}
.st-yangi{background:#fff4d6;color:#9a6b00}
.st-tayyorlanmoqda{background:#e0ecff;color:#2b5fb3}
.st-yuborildi{background:#dff5e3;color:#1f8a3b}
.st-bekor{background:#fdecea;color:#c0392b}
.ord-meta{font-size:14px;color:var(--ink-soft);margin-top:3px;overflow-wrap:break-word}
.ord-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ord-actions button{font-size:13px;font-weight:700;padding:7px 11px;border-radius:9px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft)}
.ord-actions button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
/* books list */
.bk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.bk-card{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.bk-cover{width:70px;height:88px;border-radius:10px;overflow:hidden;flex-shrink:0;display:grid;place-items:center;font-size:34px}
.bk-cover img{width:100%;height:100%;object-fit:cover}
.bk-body{flex:1;min-width:0}
.bk-body b{font-size:15px}
.bk-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bk-actions button{font-size:13px;font-weight:700;padding:6px 10px;border-radius:9px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft)}
.bk-actions .del{color:#c0392b}
/* add form */
.add-form{max-width:720px}
.co-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:600px){.co-grid3{grid-template-columns:1fr}}
.pdf-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.pdf-row{grid-template-columns:1fr}}
.pdf-pick{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:12px;font-weight:700;font-size:14px;cursor:pointer}
.pdf-pick input{font-size:12px}
.pdf-pick small{font-weight:600;color:var(--ink-soft);font-size:12px}


@media(max-width:1024px){
  .hero-grid{grid-template-columns:1fr;gap:20px;text-align:center;min-height:0}
  .hero-copy{max-width:100%;margin:0 auto}
  .hero .eyebrow{margin:0 auto}
  .hero-sub{margin-left:auto;margin-right:auto}
  .hero-cta{justify-content:center}
  .hero-motion{min-height:clamp(300px,60vw,420px);order:-1}
  .motion-stage{transform:rotate(-5deg)}
  .detail{grid-template-columns:1fr}
  .detail-cover{position:static;max-width:300px;margin:0 auto}
}
@media(max-width:768px){
  .nav{display:none}
  .ft-grid{grid-template-columns:1fr 1fr}
  .career h2{max-width:100%}
}
@media(max-width:520px){
  .hd-in{height:60px}
  .co-grid{grid-template-columns:1fr}
  .pay{grid-template-columns:1fr}
  .ft-grid{grid-template-columns:1fr}
  .hero-cta .btn{flex:1}
  .sec-head{flex-direction:column;align-items:flex-start;gap:6px}
}
